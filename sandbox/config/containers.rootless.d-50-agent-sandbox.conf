# =============================================================================
# agent-ide sandbox - force rootless containers onto a policed bridge network
# =============================================================================
# Install (root-owned, so it applies to every rootless user on the host and
# cannot be changed by accident):
#
#   sudo install -D -m 0644 \
#     sandbox/config/containers.rootless.d-50-agent-sandbox.conf \
#     /etc/containers/containers.rootless.d/50-agent-sandbox.conf
#
# or, for a single user only:
#
#   sudo install -D -m 0644 sandbox/config/containers.rootless.d-50-agent-sandbox.conf \
#     /etc/containers/containers.rootless.d/$(id -u)/50-agent-sandbox.conf
#
# Why both keys are needed
# ------------------------
# * Without `netns = "bridge"`, a plain `podman run` as a rootless user defaults
#   to a *per-container pasta* network. In that mode the container is handed a
#   copy of the host's addresses (it "sees" the LAN and the host's IP), the
#   traffic is emitted by the pasta process as ordinary host sockets, and there
#   is no kernel forward path in podman's rootless netns - so the nftables
#   egress policy in sandbox/nftables/agent-egress.nft is never evaluated.
#   Verified on podman 5.8.2/5.8.7: plain `podman run` -> container has
#   enp5s0 = the host's LAN address; with netns=bridge -> eth0 10.88.0.x and
#   default via the bridge gateway, i.e. a path the policy does filter.
# * `default_network` only takes effect when the bridge network mode is
#   selected (see containers.conf(5)), which is what the line above selects.
#   Every container that does not ask for another network - including ones
#   created by the VS Code Dev Containers extension - then lands on the
#   network whose egress the policy governs.
#
# Residual gap (by design, but auditable): a container can still be started
# with an explicit --network host, --network pasta or --network slirp4netns and
# bypass the policy. Audit with:
#
#   for c in $(podman ps -q); do
#     printf '%s %s\n' "$(podman inspect -f '{{.Name}}' "$c")" \
#                      "$(podman inspect -f '{{.HostConfig.NetworkMode}}' "$c")"
#   done
#
# Anything that is not a policed bridge network name is not filtered.
# `sandbox/scripts/agent-egress-verify.sh` warns about such containers.
# =============================================================================
[containers]
netns = "bridge"

[network]
# The network containers land on by default. Use "agent-internal" (created with
# --internal) instead of "agent-lan" if the workload does not need the LAN at
# all - that is the only tier that cannot fail open.
default_network = "agent-lan"
