# =============================================================================
# agent-ide sandbox - egress policy scope
# =============================================================================
# Sourced by sandbox/scripts/agent-egress-apply.sh. Keep it plain sh: simple
# assignments only, no command substitution (the file is also parsed by tools
# that only understand simple values).
#
# Which podman networks the default-deny policy applies to.
#
#   all              every bridge network on this host (recommended default).
#                    Agents started without --network join the default `podman`
#                    network, and VS Code's Dev Containers extension creates
#                    containers on its own - policing only a hand-named
#                    "agent-lan" network would leave both of those paths open.
#   "net1 net2"      restrict the policy to those networks' bridges, and put
#                    anything that legitimately needs direct internet access
#                    into AGENT_NETWORK_EXCLUDE instead.
AGENT_NETWORKS="all"

# Networks to leave unpoliced (space separated). Internal networks (created
# with --internal) do not need an exclusion - they have no route off the host.
AGENT_NETWORK_EXCLUDE=""
